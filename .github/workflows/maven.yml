name: Compile and test
on:
  push:
    paths:
    - 'src/**'
    - 'pom.xml'
    - '.github/workflows/maven.yml'
  pull_request:
    paths:
    - 'src/**'
    - 'pom.xml'

jobs:
  compile:
    name: Maven compiler
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Java 17 setup
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-package: jdk
        java-version: '17'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build via Maven
      run: mvn verify -B --file pom.xml -DdisableXmlReport=true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mcMMO-${{ github.sha }}
        path: |
          target/mcMMO.jar
          target/mcMMO-package.zip
        if-no-files-found: error

  release:
    name: Create release
    needs: compile          # only runs if compile job passed
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'  # only on push to master, not PRs

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Java 17 setup
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '17'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build via Maven
      run: mvn verify -B --file pom.xml -DdisableXmlReport=true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}   # e.g. build-42
        name: Build ${{ github.run_number }}
        body: |
          Automated build from commit ${{ github.sha }}
          ${{ github.event.head_commit.message }}
        files: |
          target/mcMMO.jar
          target/mcMMO-package.zip
        prerelease: true    # marks it as a pre-release since it's not a tagged version
